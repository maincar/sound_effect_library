<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="OZUXnz2dq-uqkAN4pJ6e1ynbfsdCJkLxc9Nsod7xL_Y" />
  <title>効果音リンク集</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="無料で使える効果音のリンク集。カテゴリ別・検索・並び替えでお目当ての効果音をすぐに見つけられます。">
  <link rel="canonical" href="https://maincar.github.io/sound_effect_library/index.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="効果音リンク集">
  <meta property="og:title" content="効果音リンク集">
  <meta property="og:description" content="無料で使える効果音のリンク集。カテゴリ別・検索・並び替えでお目当ての効果音をすぐに見つけられます。">
  <meta property="og:url" content="https://maincar.github.io/sound_effect_library/index.html">

<style>
body {
  font-family: system-ui, sans-serif;
  margin: 0;
  padding: 16px;
  background: #f5f5f5;
}

h1 {
  text-align: center;
  margin-bottom: 12px;
}

.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

#search, #sort {
  width: 100%;
  padding: 12px;
  font-size: 15px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.top-bar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 8px;
}

#langToggle {
  padding: 6px 12px;
  border-radius: 20px;
  border: 1px solid #ccc;
  background: #fff;
  font-size: 13px;
}

.categories {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin-bottom: 16px;
}

.categories button {
  padding: 8px 14px;
  border-radius: 20px;
  border: none;
  background: #ddd;
  font-size: 14px;
  white-space: nowrap;
}

.categories button.active {
  background: #333;
  color: #fff;
}

.list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
}

.card {
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  text-decoration: none;
  color: #000;
}

.card img {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
}

.card-title {
  padding: 6px;
  font-size: 14px;
  text-align: center;
}

.card-category {
  padding-bottom: 6px;
  font-size: 12px;
  text-align: center;
  color: #666;
}

/* 広告カード */
.ad-card {
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  text-decoration: none;
  color: #000;
}

.ad-card img {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
}

.ad-title {
  padding: 6px;
  font-size: 14px;
  text-align: center;
}

.ad-label {
  font-size: 11px;
  color: #666;
  text-align: center;
  padding-bottom: 6px;
}

/* スマホ下部バナー */
#bottomAd {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: none;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  background: #fff;
  box-shadow: 0 -2px 6px rgba(0,0,0,0.2);
  z-index: 1000;
}

#bottomAd img {
  height: 40px;
}

#bottomAd button {
  margin-left: auto;
  border: none;
  background: #ccc;
  border-radius: 4px;
}

</style>
</head>

<body>

<div class="top-bar">
  <button id="langToggle" aria-label="Switch language">English</button>
</div>

<h1 id="pageTitle">効果音リンク集</h1>

<div class="controls">
  <input id="search" type="text" placeholder="検索" aria-label="検索">
  <select id="sort" aria-label="並び替え">
    <option value="new">新着順</option>
    <option value="old">古い順</option>
    <option value="title-asc">タイトル昇順</option>
    <option value="title-desc">タイトル降順</option>
  </select>
</div>

<div class="categories" id="categories"></div>

<div class="list" id="list"></div>

<div id="bottomAd">
  <a id="bottomLink" target="_blank">
    <img id="bottomImg" alt="広告">
  </a>
  <button id="bottomClose" aria-label="閉じる">×</button>
</div>

<script>
const I18N = {
  ja: {
    pageTitle: "効果音リンク集",
    searchPlaceholder: "検索",
    searchLabel: "検索",
    sortLabel: "並び替え",
    sortNew: "新着順",
    sortOld: "古い順",
    sortTitleAsc: "タイトル昇順",
    sortTitleDesc: "タイトル降順",
    all: "すべて",
    uncategorized: "未分類",
    ad: "広告",
    closeLabel: "閉じる",
    langToggle: "English",
    metaDescription: "無料で使える効果音のリンク集。カテゴリ別・検索・並び替えでお目当ての効果音をすぐに見つけられます。",
    soundMetaDescription: title => `${title}の効果音です。YouTubeで視聴できます。`,
    soundPageTitle: title => `${title} 効果音｜無料効果音`,
  },
  en: {
    pageTitle: "Sound Effect Library",
    searchPlaceholder: "Search",
    searchLabel: "Search",
    sortLabel: "Sort",
    sortNew: "Newest",
    sortOld: "Oldest",
    sortTitleAsc: "Title (A-Z)",
    sortTitleDesc: "Title (Z-A)",
    all: "All",
    uncategorized: "Uncategorized",
    ad: "Ad",
    closeLabel: "Close",
    langToggle: "日本語",
    metaDescription: "A free library of sound effect links. Search, sort, and filter by category to quickly find the sound you need.",
    soundMetaDescription: title => `Free sound effect: ${title}. Listen on YouTube.`,
    soundPageTitle: title => `${title} — Free Sound Effects`,
  }
};

const SHEET_ID = "ここにスプレッドシートID";
const ADS_SHEET = "ads";
const ADS_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${ADS_SHEET}`;

const SOUNDS_URL = "data/sounds.json";

const params = new URLSearchParams(location.search);
const soundSlug = params.get("sound");

let ads = {
  feed: [],
  bottom: []
};

let data = [];
let currentCategoryKey = "all";
let lang = localStorage.getItem("lang") === "en" ? "en" : "ja";

function t() {
  return I18N[lang];
}

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

fetch(ADS_URL)
  .then(res => res.text())
  .then(text => {
    const rows = text.trim().split("\n").slice(1);
    rows.forEach(row => {
      const [enabled, type, title, image, link] =
        row.replace(/"/g, "").split(",");
      if (enabled === "ON" && ads[type]) {
        ads[type].push({ title, image, link });
      }
    });
    setupBottomAd();
  });

fetch(SOUNDS_URL)
  .then(res => res.json())
  .then(json => {
    data = json.sounds || [];
    buildCategories();
    render();
  });

function buildCategories() {
  const seen = new Map();
  data.forEach(d => {
    if (!seen.has(d.category.key)) seen.set(d.category.key, d.category);
  });
  const categories = [{ key: "all" }, ...seen.values()];

  const el = document.getElementById("categories");
  el.innerHTML = "";

  categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.textContent = cat.key === "all" ? t().all : (cat[lang] || cat.ja);
    if (cat.key === currentCategoryKey) btn.classList.add("active");
    btn.onclick = () => {
      currentCategoryKey = cat.key;
      document.querySelectorAll(".categories button")
        .forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    };
    el.appendChild(btn);
  });
}

function applyStaticText() {
  const s = t();
  document.documentElement.lang = lang;
  document.getElementById("langToggle").textContent = s.langToggle;
  document.getElementById("search").placeholder = s.searchPlaceholder;
  document.getElementById("search").setAttribute("aria-label", s.searchLabel);
  document.getElementById("sort").setAttribute("aria-label", s.sortLabel);
  document.getElementById("bottomClose").setAttribute("aria-label", s.closeLabel);

  const sortEl = document.getElementById("sort");
  sortEl.options[0].textContent = s.sortNew;
  sortEl.options[1].textContent = s.sortOld;
  sortEl.options[2].textContent = s.sortTitleAsc;
  sortEl.options[3].textContent = s.sortTitleDesc;

  if (!soundSlug) {
    document.getElementById("pageTitle").textContent = s.pageTitle;
    document.title = s.pageTitle;
    setMetaDescription(s.metaDescription);
    setOg({ title: s.pageTitle, description: s.metaDescription, url: "https://maincar.github.io/sound_effect_library/index.html" });
  }
}

document.getElementById("langToggle").addEventListener("click", () => {
  lang = lang === "ja" ? "en" : "ja";
  localStorage.setItem("lang", lang);
  applyStaticText();
  buildCategories();
  render();
});

function render() {
  applyStaticText();

  // ▼ 個別効果音ページ
  if (soundSlug) {
    const item = data.find(d => d.slug === soundSlug);
    if (!item) return;

    const title = item.title[lang] || item.title.ja;
    const category = item.category[lang] || item.category.ja;

    document.title = t().soundPageTitle(title);
    setMetaDescription(t().soundMetaDescription(title));
    setOg({
      title,
      description: t().soundMetaDescription(title),
      image: item.thumbnail,
      url: `https://maincar.github.io/sound_effect_library/index.html?sound=${item.slug}`
    });
    setJsonLd(item, title);

    document.getElementById("pageTitle").textContent = title;

    document.getElementById("list").innerHTML = `
      <a class="card" href="${item.url}" target="_blank">
        <img src="${item.thumbnail}" alt="${escapeHtml(title)}">
        <div class="card-title">${escapeHtml(title)}</div>
        <div class="card-category">${escapeHtml(category)}</div>
      </a>
    `;

    return;
  }

  // ▼ 一覧表示（従来処理）
  const keyword = document.getElementById("search").value.toLowerCase();
  const sortType = document.getElementById("sort").value;

  let list = data.filter(d => {
    const matchCategory =
      currentCategoryKey === "all" || d.category.key === currentCategoryKey;
    const title = (d.title[lang] || d.title.ja).toLowerCase();
    const matchKeyword = title.includes(keyword);
    return matchCategory && matchKeyword;
  });

  // 並び替え
  list.sort((a, b) => {
    const titleA = a.title[lang] || a.title.ja;
    const titleB = b.title[lang] || b.title.ja;
    switch (sortType) {
      case "old":
        return new Date(a.publishedAt) - new Date(b.publishedAt);
      case "title-asc":
        return titleA.localeCompare(titleB, lang);
      case "title-desc":
        return titleB.localeCompare(titleA, lang);
      default: // new
        return new Date(b.publishedAt) - new Date(a.publishedAt);
    }
  });

  const el = document.getElementById("list");
  el.innerHTML = "";

  list.forEach((item, i) => {
    const title = item.title[lang] || item.title.ja;
    const category = item.category[lang] || item.category.ja;

    el.innerHTML += `
      <a class="card" href="?sound=${item.slug}">
        <img src="${item.thumbnail}" alt="${escapeHtml(title)}">
        <div class="card-title">${escapeHtml(title)}</div>
        <div class="card-category">${escapeHtml(category)}</div>
      </a>
    `;

    if ((i + 1) % 8 === 0 && ads.feed.length) {
      const ad = ads.feed[i % ads.feed.length];
      el.innerHTML += `
        <a class="ad-card" href="${ad.link}" target="_blank">
          <img src="${ad.image}" alt="${escapeHtml(ad.title)}">
          <div class="ad-title">${escapeHtml(ad.title)}</div>
          <div class="ad-label">${t().ad}</div>
        </a>
      `;
    }
  });
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("sort").addEventListener("change", render);

function setupBottomAd() {
  if (!ads.bottom.length) return;

  const ad = ads.bottom[0];
  document.getElementById("bottomImg").src = ad.image;
  document.getElementById("bottomLink").href = ad.link;
  document.getElementById("bottomAd").style.display = "flex";

  document.getElementById("bottomClose").onclick = () => {
    document.getElementById("bottomAd").style.display = "none";
  };
}

function setMetaDescription(text) {
  let meta = document.querySelector("meta[name='description']");
  if (!meta) {
    meta = document.createElement("meta");
    meta.name = "description";
    document.head.appendChild(meta);
  }
  meta.content = text;
}

function setOgTag(property, content) {
  let meta = document.querySelector(`meta[property='${property}']`);
  if (!meta) {
    meta = document.createElement("meta");
    meta.setAttribute("property", property);
    document.head.appendChild(meta);
  }
  meta.content = content;
}

function setOg({ title, description, image, url }) {
  setOgTag("og:title", title);
  setOgTag("og:description", description);
  setOgTag("og:url", url);
  if (image) setOgTag("og:image", image);
}

function setJsonLd(item, title) {
  let script = document.getElementById("jsonLd");
  if (!script) {
    script = document.createElement("script");
    script.type = "application/ld+json";
    script.id = "jsonLd";
    document.head.appendChild(script);
  }
  script.textContent = JSON.stringify({
    "@context": "https://schema.org",
    "@type": "VideoObject",
    name: title,
    description: t().soundMetaDescription(title),
    thumbnailUrl: item.thumbnail,
    uploadDate: item.publishedAt,
    contentUrl: item.url,
    embedUrl: item.url
  });
}
</script>

</body>
</html>
